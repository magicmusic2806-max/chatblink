# Deploys the Worker on every push to main.
#
# This is the only path to production: Render used to auto-deploy on push, and after the Cloudflare
# cutover nothing did - a push that changed the client bundle left the live site on old code.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   created from the "Edit Cloudflare Workers" template on the
#                          Account API tokens page (dash.cloudflare.com/?to=/:account/api-tokens)
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the chatblink.chat zone
#
# What this deliberately does not do:
#   - Worker secrets (AUTH_SECRET, ...) stay on the Worker, where `npx wrangler secret put` puts them
#     and where a deploy leaves them alone.
#   - The remote D1 schema stays a manual step (`npm run db:remote`): DDL should not run on a push.
#
# Plain steps rather than cloudflare/wrangler-action: wrangler is already pinned in package.json, so
# `npm ci` plus `npx wrangler deploy` deploys with exactly the version the suites were run against,
# and there is no third-party action to keep current.

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one that is already uploading a new version.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # node 26 matches the development machine (node 26.1 / npm 11), so npm ci resolves the lockfile
      # the same way it does locally; package.json only requires >= 20.
      # setup-node@v7 rather than v4: the older majors run on the now-deprecated Node 20 runtime.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: the browser test suite is not part of this pipeline, and
      # without it npm ci pulls ~1 GB of browsers on every single deploy.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # Server-free and instant: it imports worker/index.js and drives its handler, so a module that
      # cannot even be loaded never reaches production.
      - run: npm run test:canonical

      # The secrets a local `wrangler dev` normally reads. .dev.vars is gitignored because a developer's
      # copy holds real ones, so CI writes its own: the Worker signs device tokens with AUTH_SECRET, and an
      # empty key throws, which would fail every signup in the suites below.
      - name: Test secrets for the local Worker
        run: printf 'AUTH_SECRET=ci-only-not-a-real-secret\n' > .dev.vars

      # Chess and Draw & Guess carry server-authoritative rules — legal moves, clocks, turns, scoring — so
      # the two suites that prove them run before anything is uploaded. They start their own `wrangler dev`
      # instances with shortened timers, which is why they cannot join the server-free check above. The
      # browser suites stay out of this pipeline (hence PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD); these two only
      # need sockets, so npm ci must not pull browsers for them.
      - name: Game rules (chess + Draw & Guess)
        env:
          CI: "1"
          WRANGLER_SEND_METRICS: "false"
        run: node tests/run-all.js chess draw

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings -> Secrets and variables -> Actions, then re-run this job. See DEPLOY.md, 'Deploying from CI'."
            exit 1
          fi
          npx wrangler --version
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          {
            echo "### Deployed $(date -u +%Y-%m-%dT%H:%MZ)"
            echo '```'
            grep -E "Deployed|workers\.dev|custom domain|Version ID" /tmp/deploy.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
