<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<title>2048 — Chatblink arcade</title>
<meta name="robots" content="noindex,follow">
<script>(()=>{try{if(localStorage.getItem("chatblink.theme")==="light"){document.documentElement.dataset.theme="light"}else{document.documentElement.dataset.theme="dark"}}catch{}})()</script>
<style>
  /* The arcade pages are standalone: no multi-room.css, no client bundle, no socket. A solo game has
     nothing to validate and nothing to cheat at, so it never touches the Worker. */
  :root{--ink:#172033;--muted:#667085;--line:#e4e9f2;--canvas:#f4f7fb;--surface:#fff;--brand:#4f46e5;
    --cell:#eef1f7;--tile-a:#eee4da;--tile-b:#ede0c8;--shadow:0 10px 30px #1720330f}
  html[data-theme=dark]{--ink:#e7ecf6;--muted:#94a1b6;--line:#232c3d;--canvas:#090a12;--surface:#11151f;
    --brand:#8b93ff;--cell:#1b2130;--tile-a:#2a3446;--tile-b:#333f54;--shadow:0 10px 30px #0006;color-scheme:dark}
  *{box-sizing:border-box}
  /* Author rules beat the user-agent [hidden] rule, so the overlays must opt out explicitly or they
     paint over the board on load. */
  [hidden]{display:none!important}
  body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);
    font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:16px 18px;max-width:560px;margin:0 auto;width:100%}
  header a{color:var(--brand);text-decoration:none;font-weight:700;font-size:14px}
  header h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em}
  main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:0 18px 28px;display:flex;flex-direction:column;gap:14px}
  .scoreboard{display:flex;gap:10px;align-items:stretch}
  .score{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow)}
  .score small{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .score b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  .controls{display:flex;gap:8px}
  button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink);padding:11px 14px;font-weight:700;font-size:14px}
  button.primary{background:var(--brand);border-color:transparent;color:#fff}
  button:active{transform:translateY(1px)}
  .board{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:10px;box-shadow:var(--shadow);touch-action:none}
  /* minmax(0,1fr) + min-width:0: a plain 1fr floors a column at its min-content width, and an
     aspect-ratio cell reports one, so the board would refuse to shrink on a narrow screen. */
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .cell{aspect-ratio:1;min-width:0;border-radius:12px;background:var(--cell);display:grid;place-items:center}
  .tile{width:100%;height:100%;border-radius:12px;display:grid;place-items:center;font-weight:800;
    font-size:clamp(20px,7vw,34px);font-variant-numeric:tabular-nums;transition:transform .07s ease}
  .tile.pop{animation:pop .16s ease}
  @keyframes pop{from{transform:scale(.82)}to{transform:scale(1)}}
  .tile[data-v="2"]{background:var(--tile-a)}
  .tile[data-v="4"]{background:var(--tile-b)}
  .tile[data-v="8"]{background:#f2b179;color:#3a2a15}
  .tile[data-v="16"]{background:#f59563;color:#3a2a15}
  .tile[data-v="32"]{background:#f67c5f;color:#fff}
  .tile[data-v="64"]{background:#f65e3b;color:#fff}
  .tile[data-v="128"]{background:#edcf72;color:#3a2a15;font-size:clamp(18px,5.6vw,28px)}
  .tile[data-v="256"]{background:#edcc61;color:#3a2a15;font-size:clamp(18px,5.6vw,28px)}
  .tile[data-v="512"]{background:#edc850;color:#3a2a15;font-size:clamp(18px,5.6vw,28px)}
  .tile[data-v="1024"]{background:#edc53f;color:#3a2a15;font-size:clamp(15px,4.6vw,23px)}
  .tile[data-v="2048"]{background:#edc22e;color:#3a2a15;font-size:clamp(15px,4.6vw,23px)}
  .tile.big{background:#3c3a32;color:#f9f6f2;font-size:clamp(14px,4.2vw,20px)}
  .overlay{position:absolute;inset:0;border-radius:18px;background:#0b1020cc;color:#fff;display:grid;
    place-content:center;gap:12px;justify-items:center;padding:20px;text-align:center}
  html[data-theme=light] .overlay{background:#ffffffdd;color:var(--ink)}
  .overlay h2{margin:0;font-size:22px}
  .overlay p{margin:0;color:var(--muted);font-size:13px;max-width:30ch}
  .hint{color:var(--muted);font-size:12.5px;line-height:1.5;margin:0;text-align:center}
  @media (prefers-reduced-motion:reduce){.tile.pop{animation:none}}
</style>
</head>
<body>
<header><a href="/rooms">← Rooms</a><h1>2048</h1></header>
<main>
  <div class="scoreboard">
    <div class="score"><small>Score</small><b id="score">0</b></div>
    <div class="score"><small>Best</small><b id="best">0</b></div>
  </div>
  <div class="controls">
    <button type="button" class="primary" id="restart">New game</button>
    <button type="button" id="undo">Undo</button>
  </div>
  <div class="board" id="board">
    <div class="grid" id="grid" role="grid" aria-label="2048 board"></div>
    <div class="overlay" id="overlay" hidden>
      <h2 id="overlayTitle">Game over</h2>
      <p id="overlayText"></p>
      <button type="button" class="primary" id="overlayRestart">Play again</button>
    </div>
  </div>
  <p class="hint">Swipe or use the arrow keys. Equal tiles merge into one; 2048 wins, but you can keep going.</p>
</main>
<script>
(() => {
  "use strict";
  const SIZE = 4, BEST_KEY = "chatblink.2048.best";
  const grid = document.getElementById("grid");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlayTitle");
  const overlayText = document.getElementById("overlayText");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");

  let board = new Array(SIZE * SIZE).fill(0);
  let score = 0, best = 0, won = false, over = false, previous = null;

  const readBest = () => { try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch { return 0; } };
  const writeBest = value => { try { localStorage.setItem(BEST_KEY, String(value)); } catch {} };
  const cells = [];
  for (let index = 0; index < SIZE * SIZE; index++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.dataset.index = String(index);
    cell.setAttribute("role", "gridcell");
    grid.appendChild(cell);
    cells.push(cell);
  }

  function draw(popped = new Set()) {
    cells.forEach((cell, index) => {
      const value = board[index];
      const existing = cell.firstElementChild;
      if (!value) { if (existing) cell.replaceChildren(); return; }
      if (existing && existing.dataset.v === String(value)) return;
      const tile = document.createElement("div");
      tile.className = `tile${value > 2048 ? " big" : ""}${popped.has(index) ? " pop" : ""}`;
      tile.dataset.v = String(value);
      tile.textContent = String(value);
      cell.replaceChildren(tile);
    });
    scoreEl.textContent = String(score);
    bestEl.textContent = String(best);
  }

  const emptyCells = () => board.reduce((list, value, index) => (value ? list : [...list, index]), []);
  function spawn() {
    const free = emptyCells();
    if (!free.length) return null;
    const index = free[Math.floor(Math.random() * free.length)];
    board[index] = Math.random() < 0.9 ? 2 : 4;
    return index;
  }

  // A slide walks one line at a time, compacts it, merges equal neighbours once each, and writes it back.
  // Merging twice per move is the classic 2048 bug: a 2-2-2-2 line is four 4s' worth of play, not two 8s.
  function slide(line) {
    const kept = line.filter(Boolean);
    const out = [];
    let gained = 0;
    for (let index = 0; index < kept.length; index++) {
      if (kept[index] === kept[index + 1]) { out.push(kept[index] * 2); gained += kept[index] * 2; index++; }
      else out.push(kept[index]);
    }
    while (out.length < SIZE) out.push(0);
    return { out, gained };
  }

  function lineIndexes(direction, position) {
    const list = [];
    for (let step = 0; step < SIZE; step++) {
      if (direction === "left") list.push(position * SIZE + step);
      else if (direction === "right") list.push(position * SIZE + (SIZE - 1 - step));
      else if (direction === "up") list.push(step * SIZE + position);
      else list.push((SIZE - 1 - step) * SIZE + position);
    }
    return list;
  }

  function move(direction) {
    if (over) return;
    const before = board.slice(), scoreBefore = score;
    const popped = new Set();
    let moved = false;
    for (let position = 0; position < SIZE; position++) {
      const indexes = lineIndexes(direction, position);
      const line = indexes.map(index => board[index]);
      const { out, gained } = slide(line);
      out.forEach((value, step) => {
        const index = indexes[step];
        if (board[index] !== value) moved = true;
        if (value && value !== line[step]) popped.add(index);
        board[index] = value;
      });
      score += gained;
    }
    if (!moved) return;
    previous = { board: before, score: scoreBefore };
    const spawned = spawn();
    if (spawned !== null) popped.add(spawned);
    if (score > best) { best = score; writeBest(best); }
    draw(popped);
    if (!won && board.some(value => value >= 2048)) { won = true; showOverlay("You made 2048", "Keep playing for a higher score, or start again.", true); }
    else if (!canMove()) { over = true; showOverlay("Game over", "No moves left. Start a new game.", false); }
  }

  function canMove() {
    if (emptyCells().length) return true;
    for (let row = 0; row < SIZE; row++) {
      for (let column = 0; column < SIZE; column++) {
        const value = board[row * SIZE + column];
        if (column + 1 < SIZE && board[row * SIZE + column + 1] === value) return true;
        if (row + 1 < SIZE && board[(row + 1) * SIZE + column] === value) return true;
      }
    }
    return false;
  }

  function showOverlay(title, text, keepPlaying) {
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    overlay.hidden = false;
    document.getElementById("overlayRestart").textContent = keepPlaying ? "Play again" : "Start a new game";
  }

  function start() {
    board = new Array(SIZE * SIZE).fill(0);
    score = 0; won = false; over = false; previous = null;
    overlay.hidden = true;
    spawn(); spawn();
    draw(new Set(board.map((value, index) => (value ? index : -1)).filter(index => index >= 0)));
  }

  document.getElementById("restart").onclick = start;
  document.getElementById("overlayRestart").onclick = start;
  document.getElementById("undo").onclick = () => {
    if (!previous) return;
    board = previous.board.slice(); score = previous.score; previous = null;
    over = false; overlay.hidden = true;
    draw();
  };

  const KEYS = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", a: "left", d: "right", w: "up", s: "down" };
  addEventListener("keydown", event => {
    const direction = KEYS[event.key];
    if (!direction) return;
    event.preventDefault();
    move(direction);
  }, { passive: false });

  // Touch: one swipe gesture per move, with a floor so a tap never registers as a swipe.
  let startX = 0, startY = 0, tracking = false;
  const boardEl = document.getElementById("board");
  boardEl.addEventListener("pointerdown", event => { tracking = true; startX = event.clientX; startY = event.clientY; });
  boardEl.addEventListener("pointerup", event => {
    if (!tracking) return;
    tracking = false;
    const dx = event.clientX - startX, dy = event.clientY - startY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });
  boardEl.addEventListener("pointercancel", () => { tracking = false; });

  best = readBest();
  start();
})();
</script>
</body>
</html>
